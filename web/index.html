<!doctype html><html lang="en"><meta charset="utf-8"><title>Calculator | Lab 7</title><style>body{font:20px system-ui;background:#eef2f8;color:#172c45;margin:10vh auto;max-width:700px}main{background:white;padding:40px;border-radius:20px}input,select,button{font:inherit;padding:12px;margin:8px 0;width:100%;box-sizing:border-box}button{background:#245ccc;color:white;border:0;border-radius:8px}output{display:block;font-size:28px;margin-top:24px}</style><main><small>SOFTWARE DEVELOPMENT TOOLS · LAB 7</small><h1>Two services. One calculator.</h1><form><label>First number<input name="a" type="number" step="any" required value="9"></label><label>Operation<select name="op"><option>+</option><option>-</option><option>*</option><option>/</option></select></label><label>Second number<input name="b" type="number" step="any" required value="4"></label><button>Calculate</button></form><output aria-live="polite">Ready to calculate</output><p>Web → backend API · Docker Compose</p></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();let out=document.querySelector('output');try{let r=await fetch('/api/calculate?'+new URLSearchParams(new FormData(e.target)));let data=await r.json();out.textContent=r.ok?'Result: '+data.result:data.error}catch(err){out.textContent='Backend unavailable. Please retry.'}};</script></html>
